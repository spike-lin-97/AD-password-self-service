# 示例配置。部署前请改成你自己的域控、飞书应用和随机密钥，不要把真实口令提交到仓库。

server:
  mode: debug
  addr: ":8080"
  rate-limit: 10
  rsa-public-key: public_key.pem
  rsa-private-key: private_key.pem

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

ldap:
  host: dc.example.com
  port: 636
  tls: true
  username: "CN=svc-password,OU=Service,DC=example,DC=com"
  password: "change-me"
  base: "OU=Users,DC=example,DC=com"
  # 跳过证书校验：true 时自签/过期证书也能连
  skip-verify: true
  # 读不到域 maxPwdAge 时，按此天数估算过期时间
  password-max-days: 90
  # 用 IP 连接 LDAPS 且要校验证书时，填写证书 CN/SAN
  # tls-server-name: dc.example.com
  # ca-file: /etc/ssl/certs/ad-ca.pem

cron:
  enabled: false

# 飞书扫码登录。应用凭证从飞书开放平台获取。
feishu:
  app-id: cli_your_app_id
  app-secret: your-app-secret
  # 必须与飞书开放平台「重定向 URL」完全一致
  redirect-url: http://localhost:8080/api/v1/auth/feishu/callback
  ad-mobile-attr: telephoneNumber
  # 匹配用户时的搜索 base，为空则复用 ldap.base
  ad-user-base: OU=Users,DC=example,DC=com

# Cookie Session。生产环境必须换成随机值（更换后已有登录态会失效）：
#   python3 -c "import secrets; print(secrets.token_hex(16)); print(secrets.token_hex(8))"
# hash-key 建议 32 字节；block-key 必须恰好 16 / 24 / 32 字节（AES）
session:
  cookie-name: pss_session
  hash-key: "dev-only-hash-key-replace-me!!!!"
  block-key: "dev-only-block!!"
  max-age: 3600

channel:
  platform-url: http://localhost:8080
  verify-channel: ""
  expired-channel: ""

# 管理后台（http://host:port/admin.html）。首次登录后请立刻修改。
admin:
  username: admin
  password: "change-me"
