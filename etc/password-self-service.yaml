# 示例配置。填入自己的域控信息，不要提交真实口令。

server:
  mode: debug
  addr: ":8080"
  rate-limit: 10
  rsa-public-key: public_key.pem
  rsa-private-key: private_key.pem

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

ldap:
  host: dc.example.com
  port: 636
  tls: true
  username: "CN=svc-password,OU=Service,DC=example,DC=com"
  password: "change-me"
  base: "OU=Users,DC=example,DC=com"
  filter: (sAMAccountName=%s)
  time-limit: 30
  size-limit: 1000

session:
  cookie-name: pss_session
  hash-key: "dev-only-hash-key-replace-me!!!!"
  block-key: "dev-only-block!!"
  max-age: 3600

cron:
  enabled: false

channel:
  platform-url: http://localhost:8080
