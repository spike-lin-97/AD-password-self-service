# main 分支发布到 192.168.9.7:8090。
# Runner 是 shell 执行器（跑在 gitlab-runner 容器里）。
# 项目 CI/CD 变量 DEPLOY_PASSWORD：目标机 skyland 的登录密码，同时用于 sudo。

stages:
  - build
  - deploy

variables:
  DEPLOY_HOST: "192.168.9.7"
  DEPLOY_USER: "skyland"
  GOPROXY: "https://goproxy.cn,direct"
  GO_TARBALL: "go1.22.12.linux-amd64.tar.gz"

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -euo pipefail
      # 安装到作业用户可写目录（避免 /usr/local 无写权限）
      export GO_ROOT="${CI_PROJECT_DIR}/.go"
      export PATH="${GO_ROOT}/go/bin:${PATH}"
      if ! command -v go >/dev/null 2>&1 || ! go version | grep -Eq 'go1\.(2[2-9]|[3-9][0-9])'; then
        curl -fsSL -o "/tmp/${GO_TARBALL}" "https://mirrors.aliyun.com/golang/${GO_TARBALL}" \
          || curl -fsSL -o "/tmp/${GO_TARBALL}" "https://go.dev/dl/${GO_TARBALL}"
        rm -rf "${GO_ROOT}"
        mkdir -p "${GO_ROOT}"
        tar -C "${GO_ROOT}" -xzf "/tmp/${GO_TARBALL}"
      fi
      cd feishu-login
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o bin/password-self-service main.go
  artifacts:
    paths:
      - feishu-login/bin/password-self-service
    expire_in: 7 days

deploy:
  stage: deploy
  needs:
    - build
  environment:
    name: production
    url: http://192.168.9.7:8090
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -euo pipefail
      test -n "${DEPLOY_PASSWORD:-}" || { echo "缺少 CI/CD 变量 DEPLOY_PASSWORD"; exit 1; }
      if ! command -v sshpass >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq sshpass
      fi
      export SSHPASS="$DEPLOY_PASSWORD"
      SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no)
      SCP=(sshpass -e scp -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no)
      "${SCP[@]}" feishu-login/bin/password-self-service "$DEPLOY_USER@$DEPLOY_HOST:/tmp/password-self-service.new"
      "${SCP[@]}" feishu-login/deploy/password-self-service.service "$DEPLOY_USER@$DEPLOY_HOST:/tmp/password-self-service.service"
      "${SCP[@]}" feishu-login/etc/password-self-service.yaml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/password-self-service.yaml.example"
      "${SCP[@]}" feishu-login/deploy/ci-install.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/password-self-service-install.sh"
      "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "printf '%s\n' '$DEPLOY_PASSWORD' | sudo -S -p '' bash /tmp/password-self-service-install.sh"
