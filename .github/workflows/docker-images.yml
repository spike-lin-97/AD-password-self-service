name: Build current service

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: login-new/package-lock.json
      - name: Build login page
        working-directory: login-new
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: feishu-login/go.mod
          cache-dependency-path: feishu-login/go.sum
      - name: Check and build service
        working-directory: feishu-login
        env:
          CGO_ENABLED: '0'
        run: |
          go test -mod=vendor ./...
          go vet -mod=vendor ./...
          go build -mod=vendor -trimpath -o bin/password-self-service main.go
      - uses: actions/upload-artifact@v4
        with:
          name: password-self-service-linux-amd64
          path: feishu-login/bin/password-self-service
